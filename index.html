<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Open World Sandbox</title>

<style>
body { margin:0; overflow:hidden; background:black; }
#ui{
position:absolute;
top:10px;
left:10px;
color:white;
font-family:Arial;
z-index:10;
}
</style>
</head>

<body>

<div id="ui">
<h3>🌍 3D OPEN WORLD SANDBOX</h3>
<p>Move: WASD | Jump: SPACE</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   BASIC SETUP
========================= */
let scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87ceeb, 10, 200);

let camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
let sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(10,20,10);
scene.add(sun);

let ambient = new THREE.AmbientLight(0x404040);
scene.add(ambient);

/* =========================
   GROUND (OPEN WORLD FLOOR)
========================= */
let groundGeo = new THREE.PlaneGeometry(500,500);
let groundMat = new THREE.MeshStandardMaterial({color:0x228B22});
let ground = new THREE.Mesh(groundGeo,groundMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* =========================
   PLAYER
========================= */
let playerGeo = new THREE.BoxGeometry(1,2,1);
let playerMat = new THREE.MeshStandardMaterial({color:0x00ffd5});
let player = new THREE.Mesh(playerGeo,playerMat);
player.position.y = 1;
scene.add(player);

/* CAMERA POSITION */
camera.position.set(0,5,10);

/* =========================
   TREES (WORLD GENERATION)
========================= */
function createTree(x,z){
let trunk = new THREE.Mesh(
new THREE.CylinderGeometry(0.3,0.3,2),
new THREE.MeshStandardMaterial({color:0x8B4513})
);

let leaves = new THREE.Mesh(
new THREE.SphereGeometry(1.2),
new THREE.MeshStandardMaterial({color:0x00aa00})
);

let tree = new THREE.Group();
trunk.position.y = 1;
leaves.position.y = 3;

tree.add(trunk);
tree.add(leaves);

tree.position.set(x,0,z);
scene.add(tree);
}

/* generate world */
for(let i=0;i<50;i++){
let x = (Math.random()-0.5)*200;
let z = (Math.random()-0.5)*200;
createTree(x,z);
}

/* =========================
   CONTROLS
========================= */
let keys = {};

document.addEventListener("keydown",(e)=>{
keys[e.key] = true;
});

document.addEventListener("keyup",(e)=>{
keys[e.key] = false;
});

/* movement */
let velocityY = 0;
let gravity = 0.01;
let canJump = false;

/* =========================
   GAME LOOP
========================= */
function animate(){

requestAnimationFrame(animate);

/* MOVEMENT */
let speed = 0.2;

if(keys["w"]) player.position.z -= speed;
if(keys["s"]) player.position.z += speed;
if(keys["a"]) player.position.x -= speed;
if(keys["d"]) player.position.x += speed;

/* JUMP */
if(keys[" "] && canJump){
velocityY = 0.2;
canJump = false;
}

velocityY -= gravity;
player.position.y += velocityY;

if(player.position.y <= 1){
player.position.y = 1;
velocityY = 0;
canJump = true;
}

/* CAMERA FOLLOW */
camera.position.x += (player.position.x - camera.position.x) * 0.05;
camera.position.z += (player.position.z + 8 - camera.position.z) * 0.05;
camera.lookAt(player.position);

/* RENDER */
renderer.render(scene,camera);
}

animate();

/* RESIZE */
window.addEventListener("resize",()=>{
camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
