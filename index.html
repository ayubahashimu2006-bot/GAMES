<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ULTRA SANDBOX - GTA Style Open World</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  background: #000;
  font-family: 'Arial', sans-serif;
}

#canvas {
  display: block;
  width: 100%;
  height: 100vh;
}

/* UI CONTAINER */
#ui {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 10;
}

/* HUD */
#hud {
  position: absolute;
  top: 20px;
  left: 20px;
  color: #00ff00;
  font-family: 'Courier New', monospace;
  text-shadow: 0 0 10px rgba(0,255,0,0.5);
  font-size: 14px;
}

#hud h2 {
  color: #00ff00;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.hud-item {
  margin: 8px 0;
  display: flex;
  justify-content: space-between;
  min-width: 200px;
}

.hud-label {
  color: #00ff00;
}

.hud-value {
  color: #ffff00;
  font-weight: bold;
}

/* MINIMAP */
#minimap {
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 150px;
  height: 150px;
  border: 3px solid #00ff00;
  background: rgba(0, 0, 0, 0.8);
  box-shadow: 0 0 15px rgba(0,255,0,0.3);
}

#minimapCanvas {
  width: 100%;
  height: 100%;
}

/* SPEEDOMETER */
#speedometer {
  position: absolute;
  bottom: 20px;
  left: 20px;
  width: 150px;
  height: 150px;
  border: 3px solid #00ff00;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,0,0,0.9), rgba(0,20,0,0.8));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: #00ff00;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(0,255,0,0.5);
  box-shadow: 0 0 15px rgba(0,255,0,0.3);
}

/* CONTROLS DISPLAY */
#controls {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(0, 0, 0, 0.9);
  border: 2px solid #00ff00;
  padding: 15px;
  color: #00ff00;
  font-size: 12px;
  max-width: 250px;
  box-shadow: 0 0 15px rgba(0,255,0,0.3);
}

#controls h3 {
  margin-bottom: 10px;
  color: #ffff00;
}

.control-line {
  margin: 5px 0;
}

/* CROSSHAIR */
#crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 30px;
  height: 30px;
  border: 2px solid rgba(0, 255, 0, 0.5);
  border-radius: 50%;
  pointer-events: none;
}

#crosshair::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 4px;
  height: 4px;
  background: #00ff00;
  border-radius: 50%;
}

/* NOTIFICATION */
#notification {
  position: absolute;
  top: 100px;
  right: 20px;
  background: rgba(0, 0, 0, 0.95);
  border-left: 4px solid #00ff00;
  color: #00ff00;
  padding: 15px;
  min-width: 250px;
  display: none;
  box-shadow: 0 0 15px rgba(0,255,0,0.3);
}

/* MENU */
#menuOverlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.95);
  display: none;
  z-index: 100;
  pointer-events: all;
}

#menu {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: #00ff00;
}

#menu h1 {
  font-size: 48px;
  margin-bottom: 30px;
  text-shadow: 0 0 20px rgba(0,255,0,0.8);
  letter-spacing: 3px;
}

.menu-button {
  display: block;
  margin: 15px auto;
  padding: 12px 40px;
  background: rgba(0, 255, 0, 0.1);
  border: 2px solid #00ff00;
  color: #00ff00;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s;
  min-width: 250px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.menu-button:hover {
  background: rgba(0, 255, 0, 0.3);
  box-shadow: 0 0 20px rgba(0,255,0,0.5);
}

/* STATS */
.stats-panel {
  position: absolute;
  bottom: 200px;
  right: 20px;
  background: rgba(0, 0, 0, 0.9);
  border: 2px solid #00ff00;
  padding: 15px;
  color: #00ff00;
  font-size: 12px;
  box-shadow: 0 0 15px rgba(0,255,0,0.3);
}

.stat-bar {
  margin: 8px 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.stat-bar-bg {
  width: 100px;
  height: 8px;
  background: rgba(0, 255, 0, 0.2);
  border: 1px solid #00ff00;
}

.stat-bar-fill {
  height: 100%;
  background: #00ff00;
  width: 100%;
  transition: width 0.1s;
}

</style>
</head>

<body>

<div id="ui">
  <div id="menuOverlay">
    <div id="menu">
      <h1>⚔️ ULTRA SANDBOX</h1>
      <h3 style="margin-bottom: 30px;">GTA STYLE OPEN WORLD</h3>
      <button class="menu-button" onclick="startGame()">START GAME</button>
      <button class="menu-button" onclick="showControls()">CONTROLS</button>
      <button class="menu-button" onclick="showAbout()">ABOUT</button>
    </div>
  </div>

  <div id="hud">
    <h2>⚡ ULTRA SANDBOX</h2>
    <div class="hud-item">
      <span class="hud-label">POSITION:</span>
      <span class="hud-value" id="posDisplay">X: 0 Z: 0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">HEALTH:</span>
      <span class="hud-value" id="healthDisplay">100%</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">WANTED:</span>
      <span class="hud-value" id="wantedDisplay">☆☆☆☆☆</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">TIME:</span>
      <span class="hud-value" id="timeDisplay">12:00</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">CASH:</span>
      <span class="hud-value" id="moneyDisplay">$0</span>
    </div>
  </div>

  <div id="controls">
    <h3>CONTROLS</h3>
    <div class="control-line"><strong>W/A/S/D</strong> - Move</div>
    <div class="control-line"><strong>SPACE</strong> - Jump</div>
    <div class="control-line"><strong>SHIFT</strong> - Run</div>
    <div class="control-line"><strong>MOUSE</strong> - Look Around</div>
    <div class="control-line"><strong>E</strong> - Interact</div>
    <div class="control-line"><strong>Q</strong> - Weapon</div>
    <div class="control-line"><strong>P</strong> - Pause Menu</div>
  </div>

  <div id="crosshair"></div>

  <div id="notification"></div>

  <div id="speedometer">
    <div id="speedValue">0</div>
  </div>

  <div id="minimap">
    <canvas id="minimapCanvas"></canvas>
  </div>

  <div class="stats-panel">
    <div style="margin-bottom: 10px;"><strong>STATS</strong></div>
    <div class="stat-bar">
      <span>Ammo:</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill" id="ammBar" style="width: 100%;"></div></div>
    </div>
    <div class="stat-bar">
      <span>Armor:</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill" id="armorBar" style="width: 100%;"></div></div>
    </div>
    <div class="stat-bar">
      <span>Hunger:</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill" id="hungerBar" style="width: 100%;"></div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   GAME STATE
========================= */
let gameState = {
  playing: false,
  health: 100,
  armor: 100,
  ammo: 120,
  hunger: 100,
  money: 0,
  wanted: 0,
  score: 0,
  weapon: 'fists',
  time: 12 * 60
};

/* =========================
   BASIC SETUP
========================= */
let scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1a1a2e, 50, 300);
scene.background = new THREE.Color(0x1a1a2e);

let camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  2000
);

let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowShadowMap;
document.body.appendChild(renderer.domElement);

/* LIGHTING */
let sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(100, 100, 100);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.far = 500;
sun.shadow.camera.left = -200;
sun.shadow.camera.right = 200;
sun.shadow.camera.top = 200;
sun.shadow.camera.bottom = -200;
scene.add(sun);

let ambient = new THREE.AmbientLight(0x505050, 0.8);
scene.add(ambient);

/* SKY */
let skyGeo = new THREE.SphereGeometry(1000, 32, 32);
let skyMat = new THREE.MeshBasicMaterial({ color: 0x87ceeb });
let sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

/* =========================
   GROUND (HUGE TERRAIN)
========================= */
let groundGeo = new THREE.PlaneGeometry(2000, 2000);
let groundMat = new THREE.MeshStandardMaterial({
  color: 0x2d5016,
  roughness: 0.8
});
let ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* Add grid ground for better perspective */
let gridHelper = new THREE.GridHelper(2000, 50, 0x444444, 0x333333);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

/* =========================
   BUILDINGS / STRUCTURES
========================= */
function createBuilding(x, z, width, height, depth, color) {
  let buildingGeo = new THREE.BoxGeometry(width, height, depth);
  let buildingMat = new THREE.MeshStandardMaterial({ color: color });
  let building = new THREE.Mesh(buildingGeo, buildingMat);
  building.position.set(x, height / 2, z);
  building.castShadow = true;
  building.receiveShadow = true;
  scene.add(building);
  return building;
}

/* City district */
createBuilding(100, 100, 30, 60, 30, 0x444444);
createBuilding(150, 100, 30, 40, 30, 0x555555);
createBuilding(100, 150, 30, 50, 30, 0x666666);
createBuilding(-100, -100, 50, 80, 40, 0x333333);
createBuilding(-150, -100, 30, 60, 30, 0x444444);

/* =========================
   TREES
========================= */
function createTree(x, z) {
  let trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.7, 3),
    new THREE.MeshStandardMaterial({ color: 0x8B4513 })
  );
  trunk.castShadow = true;
  trunk.receiveShadow = true;

  let leaves = new THREE.Mesh(
    new THREE.SphereGeometry(2),
    new THREE.MeshStandardMaterial({ color: 0x228B22 })
  );
  leaves.position.y = 4;
  leaves.castShadow = true;
  leaves.receiveShadow = true;

  let tree = new THREE.Group();
  trunk.position.y = 1.5;
  tree.add(trunk);
  tree.add(leaves);
  tree.position.set(x, 0, z);
  scene.add(tree);
}

/* Generate forest */
for (let i = 0; i < 100; i++) {
  let x = (Math.random() - 0.5) * 1500;
  let z = (Math.random() - 0.5) * 1500;
  if (Math.abs(x) > 200 || Math.abs(z) > 200) {
    createTree(x, z);
  }
}

/* =========================
   VEHICLES (SIMPLE CARS)
========================= */
function createCar(x, z) {
  let carBody = new THREE.Mesh(
    new THREE.BoxGeometry(2, 1, 4),
    new THREE.MeshStandardMaterial({ color: 0xff0000 })
  );
  carBody.position.set(x, 1, z);
  carBody.castShadow = true;
  carBody.receiveShadow = true;

  let carTop = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.8, 2),
    new THREE.MeshStandardMaterial({ color: 0xff0000 })
  );
  carTop.position.set(x, 1.8, z - 0.3);
  carTop.castShadow = true;
  carTop.receiveShadow = true;

  scene.add(carBody);
  scene.add(carTop);

  return { body: carBody, top: carTop, x: x, z: z };
}

let cars = [];
cars.push(createCar(50, 50));
cars.push(createCar(-50, -50));
cars.push(createCar(0, 100));

/* =========================
   NPCS / ENEMIES
========================= */
function createNPC(x, z) {
  let npcGeo = new THREE.BoxGeometry(0.8, 2, 0.8);
  let npcMat = new THREE.MeshStandardMaterial({ color: 0xff9800 });
  let npc = new THREE.Mesh(npcGeo, npcMat);
  npc.position.set(x, 1, z);
  npc.castShadow = true;
  npc.receiveShadow = true;
  scene.add(npc);

  return {
    mesh: npc,
    x: x,
    z: z,
    vx: (Math.random() - 0.5) * 0.05,
    vz: (Math.random() - 0.5) * 0.05,
    health: 100
  };
}

let npcs = [];
for (let i = 0; i < 15; i++) {
  let x = (Math.random() - 0.5) * 400;
  let z = (Math.random() - 0.5) * 400;
  npcs.push(createNPC(x, z));
}

/* =========================
   PLAYER
========================= */
let playerGeo = new THREE.BoxGeometry(0.8, 2, 0.8);
let playerMat = new THREE.MeshStandardMaterial({ color: 0x00ffff });
let player = new THREE.Mesh(playerGeo, playerMat);
player.position.y = 1;
player.castShadow = true;
player.receiveShadow = true;
scene.add(player);

camera.position.set(0, 5, 15);

/* =========================
   CONTROLS & PHYSICS
========================= */
let keys = {};
let velocityY = 0;
let gravity = 0.015;
let canJump = false;
let isRunning = false;
let moveX = 0;
let moveZ = 0;

/* Raycaster for picking */
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();

document.addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') e.preventDefault();
});

document.addEventListener("keyup", (e) => {
  keys[e.key.toLowerCase()] = false;
});

document.addEventListener("mousemove", (e) => {
  if (gameState.playing) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  }
});

document.addEventListener("click", (e) => {
  if (gameState.weapon !== 'fists' && gameState.ammo > 0) {
    gameState.ammo--;
    shoot();
  }
});

function shoot() {
  raycaster.setFromCamera(mouse, camera);
  let intersects = raycaster.intersectObjects(npcs.map(n => n.mesh));

  if (intersects.length > 0) {
    let hitNPC = npcs.find(n => n.mesh === intersects[0].object);
    if (hitNPC) {
      hitNPC.health -= 25;
      if (hitNPC.health <= 0) {
        scene.remove(hitNPC.mesh);
        npcs = npcs.filter(n => n !== hitNPC);
        gameState.money += 100;
        showNotification("Defeated NPC! +$100");
      }
    }
  }
}

/* =========================
   GAME LOOP
========================= */
function animate() {
  requestAnimationFrame(animate);

  if (!gameState.playing) {
    renderer.render(scene, camera);
    return;
  }

  /* MOVEMENT */
  let speed = keys['shift'] ? 0.4 : 0.2;
  moveX = 0;
  moveZ = 0;

  if (keys['w']) moveZ -= speed;
  if (keys['s']) moveZ += speed;
  if (keys['a']) moveX -= speed;
  if (keys['d']) moveX += speed;

  /* Apply movement with camera rotation */
  let angle = Math.atan2(camera.position.x - player.position.x, camera.position.z - player.position.z);
  let cos = Math.cos(angle);
  let sin = Math.sin(angle);
  player.position.x += moveX * cos - moveZ * sin;
  player.position.z += moveX * sin + moveZ * cos;

  /* JUMP */
  if (keys[' '] && canJump) {
    velocityY = 0.25;
    canJump = false;
  }

  velocityY -= gravity;
  player.position.y += velocityY;

  if (player.position.y <= 1) {
    player.position.y = 1;
    velocityY = 0;
    canJump = true;
  }

  /* Decay stats */
  gameState.hunger -= 0.001;
  if (gameState.hunger < 0) {
    gameState.health -= 0.5;
    gameState.hunger = 0;
  }

  if (gameState.health <= 0) {
    gameState.health = 0;
    showNotification("YOU DIED! Game Over!");
    gameState.playing = false;
    showMenu();
  }

  /* UPDATE NPCs */
  npcs.forEach(npc => {
    npc.x += npc.vx;
    npc.z += npc.vz;

    if (Math.abs(npc.x) > 500 || Math.abs(npc.z) > 500) {
      npc.vx = (Math.random() - 0.5) * 0.05;
      npc.vz = (Math.random() - 0.5) * 0.05;
    }

    npc.mesh.position.x = npc.x;
    npc.mesh.position.z = npc.z;

    /* NPC AI - attack player if close */
    let dist = Math.hypot(player.position.x - npc.x, player.position.z - npc.z);
    if (dist < 20) {
      npc.vx = (player.position.x - npc.x) * 0.02;
      npc.vz = (player.position.z - npc.z) * 0.02;
      gameState.wanted++;

      if (dist < 3) {
        gameState.health -= 0.1;
      }
    }
  });

  /* CAMERA FOLLOW */
  let targetX = player.position.x - Math.sin(Math.atan2(camera.position.x - player.position.x, camera.position.z - player.position.z)) * 15;
  let targetZ = player.position.z + Math.cos(Math.atan2(camera.position.x - player.position.x, camera.position.z - player.position.z)) * 15;

  camera.position.x += (targetX - camera.position.x) * 0.08;
  camera.position.z += (targetZ - camera.position.z) * 0.08;
  camera.position.y = player.position.y + 3;
  camera.lookAt(player.position);

  /* UPDATE TIME */
  gameState.time += 0.01;
  if (gameState.time >= 24 * 60) gameState.time = 0;

  /* UPDATE HUD */
  updateHUD();

  /* RENDER */
  renderer.render(scene, camera);
}

/* =========================
   UI FUNCTIONS
========================= */
function updateHUD() {
  document.getElementById('posDisplay').textContent = `X: ${player.position.x.toFixed(0)} Z: ${player.position.z.toFixed(0)}`;
  document.getElementById('healthDisplay').textContent = `${gameState.health.toFixed(0)}%`;
  document.getElementById('moneyDisplay').textContent = `$${gameState.money}`;

  let wantedStars = '';
  for (let i = 0; i < Math.min(5, Math.floor(gameState.wanted / 100)); i++) wantedStars += '★';
  for (let i = 0; i < 5 - Math.min(5, Math.floor(gameState.wanted / 100)); i++) wantedStars += '☆';
  document.getElementById('wantedDisplay').textContent = wantedStars;

  let hours = Math.floor(gameState.time / 60);
  let mins = Math.floor(gameState.time % 60);
  document.getElementById('timeDisplay').textContent = `${hours}:${mins < 10 ? '0' : ''}${mins}`;

  document.getElementById('speedValue').textContent = Math.hypot(moveX, moveZ).toFixed(0);

  document.getElementById('ammBar').style.width = (gameState.ammo / 120 * 100) + '%';
  document.getElementById('armorBar').style.width = (gameState.armor / 100 * 100) + '%';
  document.getElementById('hungerBar').style.width = (gameState.hunger / 100 * 100) + '%';

  /* Minimap */
  let minimapCanvas = document.getElementById('minimapCanvas');
  let ctx = minimapCanvas.getContext('2d');
  ctx.clearRect(0, 0, 150, 150);
  ctx.fillStyle = '#222';
  ctx.fillRect(0, 0, 150, 150);

  ctx.fillStyle = '#00ff00';
  ctx.fillRect(75 - 5, 75 - 5, 10, 10);

  npcs.forEach(npc => {
    let mx = 75 + (npc.x / 500) * 40;
    let mz = 75 + (npc.z / 500) * 40;
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(mx - 2, mz - 2, 4, 4);
  });
}

function showNotification(text) {
  let notif = document.getElementById('notification');
  notif.textContent = text;
  notif.style.display = 'block';
  setTimeout(() => notif.style.display = 'none', 3000);
}

function startGame() {
  document.getElementById('menuOverlay').style.display = 'none';
  gameState.playing = true;
  animate();
}

function showMenu() {
  document.getElementById('menuOverlay').style.display = 'block';
}

function showControls() {
  alert('CONTROLS:\nWASD - Move\nSPACE - Jump\nSHIFT - Run\nMOUSE CLICK - Attack\nQ - Change Weapon\nP - Pause');
}

function showAbout() {
  alert('ULTRA SANDBOX - GTA STYLE\nA professional open-world sandbox game\nVersion 1.0\n\nFeatures:\n- Open world exploration\n- NPC AI\n- Combat system\n- Stats & HUD\n- Wanted system');
}

/* RESIZE */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* Keyboard shortcuts */
document.addEventListener('keydown', (e) => {
  if (e.key === 'p' || e.key === 'P') {
    gameState.playing = !gameState.playing;
  }
  if (e.key === 'q' || e.key === 'Q') {
    gameState.weapon = gameState.weapon === 'fists' ? 'gun' : 'fists';
    showNotification(`Weapon: ${gameState.weapon}`);
  }
});

showMenu();

</script>

</body>
</html>
