<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Runner Game</title>
<style>
body { margin:0; overflow:hidden; background:black; }
#ui {
position:absolute;
top:10px;
left:10px;
color:white;
font-family:Arial;
z-index:10;
}
button{
padding:10px;
margin:5px;
}
</style>
</head>

<body>

<div id="ui">
<h3>👑 3D Runner Game</h3>
<button onclick="startGame()">Start</button>
<p>Controls: ← → Arrow keys</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene, camera, renderer;
let player;
let obstacles = [];
let speed = 0.2;
let gameRunning = false;

init();

function init(){

/* SCENE */
scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

/* CAMERA */
camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);
camera.position.z = 5;

/* RENDERER */
renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
const light = new THREE.PointLight(0xffffff,1);
light.position.set(5,5,5);
scene.add(light);

/* PLAYER (BALL) */
const geometry = new THREE.SphereGeometry(0.5,32,32);
const material = new THREE.MeshStandardMaterial({color:0x00ffd5});
player = new THREE.Mesh(geometry,material);
scene.add(player);

/* FLOOR */
const floorGeo = new THREE.BoxGeometry(10,0.1,50);
const floorMat = new THREE.MeshStandardMaterial({color:0x222222});
const floor = new THREE.Mesh(floorGeo,floorMat);
floor.position.y = -1;
scene.add(floor);

/* CONTROLS */
document.addEventListener("keydown",move);

/* START LOOP */
animate();
}

function move(e){
if(!gameRunning) return;

if(e.key==="ArrowLeft"){
player.position.x -= 0.3;
}
if(e.key==="ArrowRight"){
player.position.x += 0.3;
}
}

function createObstacle(){
const geo = new THREE.BoxGeometry(1,1,1);
const mat = new THREE.MeshStandardMaterial({color:0xff0000});
const box = new THREE.Mesh(geo,mat);

box.position.z = -20;
box.position.x = (Math.random()*4)-2;
box.position.y = 0;

scene.add(box);
obstacles.push(box);
}

function startGame(){
gameRunning = true;
setInterval(createObstacle,1500);
}

function animate(){

requestAnimationFrame(animate);

if(gameRunning){

/* move camera forward */
player.position.z -= speed;

/* move obstacles */
obstacles.forEach(o=>{
o.position.z += speed;

if(o.position.distanceTo(player.position)<1){
alert("💀 Game Over!");
location.reload();
}
});

}

camera.position.z = player.position.z + 5;
camera.lookAt(player.position);

renderer.render(scene,camera);
}

</script>

</body>
</html>
