<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Billions Engine X</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
background:#0a0f1a;
font-family:Arial;
color:white;
overflow:hidden;
}

header{
padding:10px;
text-align:center;
color:#00ffd5;
font-weight:bold;
}

#ui{
position:absolute;
top:50px;
left:10px;
z-index:10;
}

button{
padding:8px;
margin:3px;
border:none;
border-radius:6px;
cursor:pointer;
background:#00ffd5;
color:black;
}

canvas{
background:radial-gradient(circle,#111,#000);
display:block;
}
</style>
</head>

<body>

<header>👑 BILLIONS ENGINE X — INDUSTRY LEVEL CORE</header>

<div id="ui">
<button onclick="Engine.loadScene('menu')">Menu</button>
<button onclick="Engine.loadScene('platform')">Platform</button>
<button onclick="Engine.loadScene('shooter')">Shooter</button>
<button onclick="Engine.loadScene('physics')">Physics Demo</button>
</div>

<canvas id="c"></canvas>

<script>

/* =========================
   ENGINE CORE
========================= */

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
window.onresize=resize;
resize();

/* =========================
   INPUT SYSTEM
========================= */
const Input={
keys:{}
};

window.addEventListener("keydown",e=>Input.keys[e.key]=true);
window.addEventListener("keyup",e=>Input.keys[e.key]=false);

/* =========================
   ENTITY SYSTEM
========================= */
class Entity{
constructor(x,y){
this.x=x;
this.y=y;
this.vx=0;
this.vy=0;
this.w=20;
this.h=20;
this.gravity=false;
}

update(){}

draw(){
ctx.fillStyle="white";
ctx.fillRect(this.x,this.y,this.w,this.h);
}
}

/* =========================
   ENGINE CORE LOOP
========================= */
const Engine={
currentScene:null,

entities:[],

loadScene(name){
this.entities=[];
this.currentScene=Scenes[name];
this.currentScene.init();
},

update(){
if(this.currentScene)this.currentScene.update();

this.entities.forEach(e=>{
e.update();
e.x+=e.vx;
e.y+=e.vy;

if(e.gravity)e.vy+=0.3;
});
},

render(){
ctx.clearRect(0,0,canvas.width,canvas.height);

this.entities.forEach(e=>e.draw());
}
};

/* =========================
   SCENES
========================= */

const Scenes={};

/* ===== MENU SCENE ===== */
Scenes.menu={
init(){
let e=new Entity(100,100);
Engine.entities.push(e);
},
update(){
}
};

/* ===== PLATFORM GAME ===== */
Scenes.platform={
init(){
this.player=new Entity(100,100);
this.player.gravity=true;
Engine.entities.push(this.player);
},
update(){
if(Input.keys["ArrowRight"])this.player.vx=3;
else if(Input.keys["ArrowLeft"])this.player.vx=-3;
else this.player.vx=0;

if(Input.keys[" "])this.player.vy=-8;

/* ground */
if(this.player.y>500){
this.player.y=500;
this.player.vy=0;
}
}
};

/* ===== SHOOTER ===== */
Scenes.shooter={
init(){
this.player=new Entity(200,400);
Engine.entities.push(this.player);

this.bullets=[];
},
update(){
if(Input.keys["ArrowLeft"])this.player.x-=4;
if(Input.keys["ArrowRight"])this.player.x+=4;

if(Input.keys[" "]){
this.bullets.push(new Entity(this.player.x,this.player.y));
}

/* bullets */
this.bullets.forEach(b=>{
b.vy=-6;
Engine.entities.push(b);
});
}
};

/* ===== PHYSICS DEMO ===== */
Scenes.physics={
init(){
for(let i=0;i<10;i++){
let e=new Entity(100+i*30,100);
e.gravity=true;
Engine.entities.push(e);
}
},
update(){
}
};

/* =========================
   LOOP
========================= */
function loop(){
Engine.update();
Engine.render();
requestAnimationFrame(loop);
}

Engine.loadScene("menu");
loop();

</script>

</body>
</html>
