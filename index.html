<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Billions Arcade Hub MAX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#0f2027,#000);
color:white;
}

/* HEADER */
header{
padding:15px;
text-align:center;
font-size:24px;
color:#00ffd5;
font-weight:bold;
}

/* MENU */
#menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
padding:10px;
}

.btn{
background:rgba(255,255,255,0.08);
border:1px solid #00ffd5;
padding:12px;
border-radius:10px;
cursor:pointer;
transition:0.3s;
text-align:center;
}

.btn:hover{
background:#00ffd5;
color:black;
transform:scale(1.05);
}

/* GAME AREA */
#game{
margin:15px;
padding:20px;
min-height:420px;
border:2px solid #00ffd5;
border-radius:12px;
background:rgba(255,255,255,0.05);
position:relative;
overflow:hidden;
}

.target{
width:45px;
height:45px;
background:red;
border-radius:50%;
position:absolute;
cursor:pointer;
box-shadow:0 0 10px red;
}

input,button{
padding:10px;
margin:5px;
border-radius:6px;
border:none;
}
</style>
</head>

<body>

<header>🎮 BILLIONS ARCADE HUB — MAX LEVEL</header>

<div id="menu"></div>

<div id="game">
<h3>Select a Game 👆</h3>
</div>

<script>
const menu=document.getElementById("menu");
const game=document.getElementById("game");

/* ======================
   GAME LIST
====================== */
const games=[
"🎯 Click Rush",
"⚡ Reaction Speed",
"🔢 Guess Number",
"✊ Rock Paper Scissors",
🎲 Dice Battle",
"🪙 Coin Flip",
"➕ Math Challenge",
"⌨️ Typing Speed",
"🎨 Color Match",
"🧠 Memory Flip"
];

/* MENU */
games.forEach((g,i)=>{
let b=document.createElement("div");
b.className="btn";
b.innerText=g;
b.onclick=()=>loadGame(i);
menu.appendChild(b);
});

/* RESET */
function reset(){game.innerHTML="";}

/* HIGH SCORE */
function saveScore(name,score){
let old=localStorage.getItem(name)||0;
if(score>old)localStorage.setItem(name,score);
}

/* ======================
   GAME ENGINE
====================== */
function loadGame(id){
reset();

/* 1 CLICK RUSH */
if(id==0){
let score=0;
game.innerHTML="<h3>Click Rush: "+score+"</h3>";
spawn();
function spawn(){
let t=document.createElement("div");
t.className="target";
t.style.top=Math.random()*300+"px";
t.style.left=Math.random()*300+"px";
t.onclick=()=>{
score++;
game.querySelector("h3").innerText="Click Rush: "+score;
t.remove();
spawn();
}
game.appendChild(t);
}
}

/* 2 REACTION */
if(id==1){
game.innerHTML="<h3>Wait GREEN...</h3>";
setTimeout(()=>{
game.innerHTML+=`<button style="background:green;width:120px;height:120px" onclick="alert('FAST!')">CLICK</button>`;
},2000);
}

/* 3 GUESS */
if(id==2){
let num=Math.floor(Math.random()*10);
game.innerHTML="<h3>Guess 0-9</h3><input id='g'><button onclick='check()'>Try</button>";
window.check=()=>{
alert(document.getElementById("g").value==num?"Correct":"Wrong answer: "+num);
}
}

/* 4 RPS */
if(id==3){
game.innerHTML=`
<button onclick="play('rock')">Rock</button>
<button onclick="play('paper')">Paper</button>
<button onclick="play('scissors')">Scissors</button>`;
window.play=(p)=>{
let ai=["rock","paper","scissors"][Math.floor(Math.random()*3)];
alert("AI: "+ai);
}
}

/* 5 DICE */
if(id==4){
game.innerHTML="<button onclick='alert(Math.floor(Math.random()*6)+1)'>Roll Dice</button>";
}

/* 6 COIN */
if(id==5){
game.innerHTML="<button onclick='alert(Math.random()>0.5?\"HEAD\":\"TAIL\")'>Flip</button>";
}

/* 7 MATH */
if(id==6){
let a=Math.floor(Math.random()*20);
let b=Math.floor(Math.random()*20);
game.innerHTML=`<h3>${a}+${b}=?</h3><input id='a'><button onclick='ans()'>Check</button>`;
window.ans=()=>alert(document.getElementById("a").value==a+b?"Correct":"Wrong");
}

/* 8 TYPING */
if(id==7){
game.innerHTML="<h3>Type: BILLIONS LEGEND</h3><input id='t'><button onclick='check()'>Check</button>";
window.check=()=>alert(document.getElementById("t").value=="BILLIONS LEGEND"?"Good":"Wrong");
}

/* 9 COLOR */
if(id==8){
let colors=["red","blue","green","yellow"];
let pick=colors[Math.floor(Math.random()*colors.length)];
game.innerHTML=`<h3>Click: ${pick}</h3>`;
colors.forEach(c=>{
let b=document.createElement("button");
b.innerText=c;
b.onclick=()=>alert(c==pick?"Correct":"Wrong");
game.appendChild(b);
});
}

/* 10 MEMORY */
if(id==9){
game.innerHTML="<h3>Memory Game</h3><p>Max Version Coming Next Upgrade</p>";
}
}
</script>

</body>
</html>
